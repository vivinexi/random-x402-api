
services:
  - type: web
    name: random-x402-api
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PAY_TO
        sync: false

      - key: FACILITATOR_URL
        value: https://facilitator.payai.network

      - key: API_PRICE
        value: "$0.001"
